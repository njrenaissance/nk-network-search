[project]
name = "nk-network-search"
version = "0.1.0"
description = "nk-network-search"
requires-python = ">=3.14"
dependencies = [
    "networkx>=3.6.1",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.9.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
    "types-networkx>=3.6.1.20260728",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
markers = ["unit: unit tests", "integration: integration tests"]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 70
show_missing = true

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "N", "ARG", "SIM", "ERA", "PLR", "C901"]

[tool.ruff.lint.per-file-ignores]
# Test assertions routinely compare against literal expected values (e.g.
# `assert config.seed == 7`) — that's the point of the assertion, not a code
# smell to name a constant for.
"tests/*" = ["PLR2004"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
python_version = "3.14"
files = ["src"]
disallow_untyped_defs = true
warn_return_any = true
warn_unused_configs = true
no_implicit_optional = true
