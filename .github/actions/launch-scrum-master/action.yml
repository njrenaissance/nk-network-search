name: Launch Scrum Master
description: >-
  Install the ant CLI and tickle the pre-created Scrum Master Managed Agent —
  create a session against the stored agent, mount this repo at main, and send a
  kickoff message. Data plane only: it never runs agents.create. Fire-and-exit;
  the Scrum Master is resumable and runs on Anthropic's side.

inputs:
  kickoff-message:
    description: The user.message text that starts the Scrum Master's reconcile.
    required: true
  title:
    description: Human-readable session title (shown in the Console session list).
    required: true
  anthropic-api-key:
    description: Anthropic API key. Secret.
    required: true
  github-mcp-token:
    description: GitHub token for the repo clone and GitHub MCP writes. Secret.
    required: true
  agent-id:
    description: Pre-created Scrum Master agent ID (agent_...).
    required: true
  environment-id:
    description: Pre-created environment ID (env_...).
    required: true
  vault-id:
    description: Vault ID holding the GitHub MCP credential (vlt_...).
    required: true
  repository:
    description: owner/repo to mount at main (usually github.repository).
    required: true
  ant-cli-version:
    description: Published anthropic-cli release to install, e.g. 0.12.0.
    required: true

runs:
  using: composite
  steps:
    - name: Install ant CLI
      shell: bash
      env:
        ANT_CLI_VERSION: ${{ inputs.ant-cli-version }}
      run: |
        set -euo pipefail
        if [ -z "${ANT_CLI_VERSION:-}" ]; then
          echo "::error::ant-cli-version is empty — set the ANT_CLI_VERSION repository variable to a published anthropic-cli release (e.g. 0.12.0)."
          exit 1
        fi
        curl -fsSL "https://github.com/anthropics/anthropic-cli/releases/download/v${ANT_CLI_VERSION}/ant_${ANT_CLI_VERSION}_linux_amd64.tar.gz" \
          | sudo tar -xz -C /usr/local/bin ant
        ant --version

    - name: Create session and send kickoff
      shell: bash
      env:
        # ant reads ANTHROPIC_API_KEY from the environment.
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        GITHUB_MCP_TOKEN: ${{ inputs.github-mcp-token }}
        AGENT_ID: ${{ inputs.agent-id }}
        ENV_ID: ${{ inputs.environment-id }}
        VAULT_ID: ${{ inputs.vault-id }}
        REPO: ${{ inputs.repository }}
        TITLE: ${{ inputs.title }}
        KICKOFF: ${{ inputs.kickoff-message }}
      run: |
        set -euo pipefail
        for v in ANTHROPIC_API_KEY GITHUB_MCP_TOKEN AGENT_ID ENV_ID VAULT_ID; do
          if [ -z "${!v:-}" ]; then
            echo "::error::Missing required value: $v"
            exit 1
          fi
        done

        # Build both request bodies with jq so every value (title, token,
        # kickoff text with apostrophes) is escaped — no shell-injection, no
        # heredoc-indentation traps. jq is preinstalled on ubuntu runners.
        session_body=$(jq -nc \
          --arg agent "$AGENT_ID" \
          --arg env "$ENV_ID" \
          --arg title "$TITLE" \
          --arg url "https://github.com/$REPO" \
          --arg token "$GITHUB_MCP_TOKEN" \
          --arg vault "$VAULT_ID" \
          '{
            agent: $agent,
            environment_id: $env,
            title: $title,
            resources: [{
              type: "github_repository",
              url: $url,
              authorization_token: $token,
              checkout: { type: "branch", name: "main" }
            }],
            vault_ids: [$vault]
          }')

        # ant sets the managed-agents beta header automatically. Field names map
        # 1:1 to POST /v1/sessions; --transform id -r captures the session ID.
        SID=$(printf '%s' "$session_body" | ant beta:sessions create --transform id -r)

        # --event takes one event object and appends it to the request's events
        # array; jq emits strict JSON, which the flag parser accepts.
        event_body=$(jq -nc --arg text "$KICKOFF" \
          '{ type: "user.message", content: [{ type: "text", text: $text }] }')
        ant beta:sessions:events send --session-id "$SID" --event "$event_body"

        echo "Launched Scrum Master session $SID"
