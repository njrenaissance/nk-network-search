name: Scrum Master

# Thin launcher for the coding-factory Scrum Master orchestrator (a Claude
# Managed Agent). This workflow does NO build work — it only launches the Scrum
# Master and exits. The Scrum Master is resumable, not long-running: it wakes on
# this event, reconstructs state from durable repo artifacts (spec/spec.md
# Status, spec/build-order.md, live issue/PR state, subagents' returned JSON),
# takes the single next action, and exits. It is the sole thing that spawns and
# judges every subagent (Sequencing / Planner / Build) — none of those are ever
# launched by a GitHub Action.
#
# Fires on EVERY merge to main; the Scrum Master reconciles and acts only on
# merges it owns (approved-but-unsequenced spec -> Sequencing; last issue of a
# group merged -> next group's Planners; all merged -> Deliver-ready; anything
# else -> no-op). Planning is just-in-time: only the current ready group's
# Planners are launched, never the backlog.

on:
  push:
    branches: [main]
  # Manual re-reconcile from the Actions tab. Safe and idempotent: the Scrum
  # Master reconciles from current state regardless of what woke it, so a manual
  # run just takes whatever the next action is (or a no-op) — useful if a merge
  # event was missed or you want to force a reconcile against latest main.
  workflow_dispatch:

# Single-flight, coalescing: a burst of parallel-group merges collapses to one
# reconcile against the latest main instead of one run per merge.
concurrency:
  group: scrum-master
  cancel-in-progress: true

# Least privilege: the launcher itself needs nothing beyond reading the repo.
# The Scrum Master does its own repo/issue writes via the GitHub MCP server,
# authenticated by a vault credential attached to the session, not the
# workflow's GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  reconcile:
    name: Launch Scrum Master
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The local composite action lives in the repo, so it must be checked out
      # before it can be referenced. No git credential is needed afterwards.
      - name: Check out launcher action
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # actions/checkout
        with:
          persist-credentials: false

      - name: Launch Scrum Master (merge event)
        uses: ./.github/actions/launch-scrum-master
        with:
          title: "Scrum Master reconcile: ${{ github.repository }} @ main"
          # github.repository is a trusted, non-attacker-controlled value; the
          # action passes every input through env + jq, never a raw run: string.
          kickoff-message: >-
            Reconcile ${{ github.repository }} at main. If spec/spec.md is approved
            and spec/build-order.md is absent, spawn Sequencing (awaited), then launch
            the first ready group's Planners. Else advance groups: when a group's last
            issue is merged, launch the next group's Planners (JIT — the ready group
            only, never the backlog); when all issues are merged, mark Deliver-ready.
            Otherwise no-op. Do not use labels for control flow.
          # Secret. GitHub access is via the vault-authenticated MCP server, so
          # no GitHub token is passed here.
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Non-secret identifiers — Actions Variables, not Secrets.
          agent-id: ${{ vars.SCRUM_MASTER_AGENT_ID }}
          environment-id: ${{ vars.SCRUM_MASTER_ENVIRONMENT_ID }}
          vault-id: ${{ vars.SCRUM_MASTER_VAULT_ID }}
          ant-cli-version: ${{ vars.ANT_CLI_VERSION }}
