name: Approve

# Thin launcher for the coding-factory `/approve` gate. A reviewer approves a
# plan by commenting `/approve` on its draft PR (see the Inner Plan runbook).
# This workflow does NO build work — it only launches the Scrum Master and exits.
# It launches the Scrum Master (NOT Build directly): the SM records the plan's
# `Status: approved`, spawns Build as an *awaited* subagent, reads its structured
# result, and judges it (proceed / escalate / re-plan). This launcher never
# merges — red tests must not reach main.

on:
  issue_comment:
    types: [created]

# Least privilege: the launcher only launches the agent. The Scrum Master does
# its own repo/issue/PR writes via the GitHub MCP server (GITHUB_MCP_TOKEN).
permissions:
  contents: read

jobs:
  approve:
    name: Launch Scrum Master
    # Fire only for a top-level PR-conversation comment whose body is exactly
    # `/approve`, from an authorized commenter. This ignores inline review
    # comments on diff lines (they are not issue_comment events), comments on
    # non-PR issues, any other text, and unauthorized users. The guard is a
    # bare Actions expression with no interpolation delimiters, so the Jinja
    # render leaves it untouched (no raw-wrapping needed).
    if: >
      github.event.issue.pull_request &&
      github.event.comment.body == '/approve' &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The local composite action must be checked out before it can be used.
      - name: Check out launcher action
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # actions/checkout
        with:
          persist-credentials: false

      - name: Launch Scrum Master (approve event)
        uses: ./.github/actions/launch-scrum-master
        with:
          title: "Scrum Master approve: ${{ github.repository }} PR #${{ github.event.issue.number }}"
          # issue.number is an integer and repository is trusted; the action
          # passes every input through env + jq, never a raw run: string.
          kickoff-message: >-
            Plan approved on PR #${{ github.event.issue.number }} in
            ${{ github.repository }}. Record Status: approved on that plan, spawn
            Build for its issue (awaited), then judge Build's structured result:
            proceed (Build flipped the draft PR to ready), escalate, or re-plan.
            Do not merge.
          # Secrets.
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          github-mcp-token: ${{ secrets.GITHUB_MCP_TOKEN }}
          # Non-secret identifiers — Actions Variables, not Secrets.
          agent-id: ${{ vars.SCRUM_MASTER_AGENT_ID }}
          environment-id: ${{ vars.SCRUM_MASTER_ENVIRONMENT_ID }}
          vault-id: ${{ vars.SCRUM_MASTER_VAULT_ID }}
          ant-cli-version: ${{ vars.ANT_CLI_VERSION }}
          repository: ${{ github.repository }}
